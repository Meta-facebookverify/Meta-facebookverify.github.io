<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Currently Closed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.10), transparent 35%),
                #f6f8fc;
            color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e6eaf1;
            border-radius: 24px;
            padding: 55px 45px;
            box-shadow: 0 20px 60px rgba(20, 35, 70, 0.10);
            animation: fadeIn 0.6s ease-out;
        }

        .icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: #eef4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #356ae6;
        }

        .icon svg {
            width: 40px;
            height: 40px;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.6px;
            margin-bottom: 16px;
            color: #111827;
        }

        .message {
            font-size: 16px;
            line-height: 1.7;
            color: #667085;
            max-width: 430px;
            margin: 0 auto;
        }

        .notice {
            margin-top: 30px;
            padding: 15px 18px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #edf0f5;
            color: #667085;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #98a2b3;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 42px 25px;
                border-radius: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .message {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="icon">
                <!-- Lock icon -->
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <rect x="4" y="10" width="16" height="11" rx="2"></rect>

                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>

                    <circle cx="12" cy="15.5" r="1"></circle>

                    <path d="M12 16.5v2"></path>
                </svg>
            </div>

            <h1>This Page Is Currently Closed</h1>

            <p class="message">
                This page is temporarily unavailable.
                We may be performing maintenance or making improvements
                to provide you with a better experience.
            </p>

            <div class="notice">
                Please check back later. We appreciate your patience
                and understanding.
            </div>

            <div class="footer">
                © 2026 — All rights reserved.
            </div>

        </section>

    </main>

</body>
</html>
